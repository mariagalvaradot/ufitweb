<style>
/* Concept: a night-sky app. The week is a constellation, and every meal you tick lights a four-point nova star. */
:root {
  --bg: #120F26;
  --surface: #1B1737;
  --surface-2: #241F47;
  --line: #332E5F;
  --fg: #F4EEF8;
  --muted: #A8A1C8;
  --star: #F6C768;
  --star-ink: #F6C768;
  --on-star: #1A1330;
  --rose: #F29BB8;
  --dust: rgba(255, 240, 205, .5);
  --glow: rgba(246, 199, 104, .35);
  --f-display: 'Syne', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, sans-serif;
  --f-mono: 'DM Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6F3FB; --surface: #FFFFFF; --surface-2: #EFEAF8; --line: #DDD5EE;
    --fg: #231A3C; --muted: #665E85; --star: #EDB02C; --star-ink: #8A5A00;
    --on-star: #2A1B05; --rose: #C23B66; --dust: rgba(110, 80, 180, .16); --glow: rgba(237, 176, 44, .35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F6F3FB; --surface: #FFFFFF; --surface-2: #EFEAF8; --line: #DDD5EE;
  --fg: #231A3C; --muted: #665E85; --star: #EDB02C; --star-ink: #8A5A00;
  --on-star: #2A1B05; --rose: #C23B66; --dust: rgba(110, 80, 180, .16); --glow: rgba(237, 176, 44, .35);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 8%, var(--dust) 50%, transparent 52%),
    radial-gradient(1px 1px at 78% 14%, var(--dust) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 90% 36%, var(--dust) 50%, transparent 52%),
    radial-gradient(1px 1px at 30% 52%, var(--dust) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 8% 74%, var(--dust) 50%, transparent 52%),
    radial-gradient(1px 1px at 66% 88%, var(--dust) 50%, transparent 52%);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 16px 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--star-ink); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1.15; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.q { font-family: var(--f-mono); font-weight: 500; font-size: .92em; color: var(--star-ink); }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: .8rem; letter-spacing: .22em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 16px; height: 16px; fill: var(--star); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--star); color: var(--on-star); }

/* constellation */
.const { display: flex; justify-content: space-between; position: relative; padding-top: 4px; }
.const::before { content: ""; position: absolute; left: 22px; right: 22px; top: 26px; border-top: 1px dashed var(--line); }
.node { position: relative; width: 44px; background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); }
.node .orb { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; border: 1px solid transparent; }
.node svg { width: 26px; height: 26px; fill: transparent; stroke: var(--muted); stroke-width: 1.4; stroke-linejoin: round; }
.node.part svg { fill: var(--star); fill-opacity: .4; stroke: var(--star); }
.node.full svg { fill: var(--star); stroke: var(--star); filter: drop-shadow(0 0 6px var(--glow)); }
.node .l { font-family: var(--f-display); font-weight: 800; font-size: .8rem; }
.node .d { font-family: var(--f-mono); font-size: .68rem; }
.node.sel .orb { border-color: var(--star-ink); }
.node.sel .l { color: var(--fg); }
.node.today .l { color: var(--rose); }

/* day header */
.dayhead { display: flex; flex-direction: column; gap: 6px; }
.chip { display: inline-block; align-self: flex-start; font-size: .78rem; font-weight: 600; padding: 3px 12px; border-radius: 999px; background: var(--surface-2); color: var(--star-ink); border: 1px solid var(--line); }
.count { color: var(--muted); font-size: .92rem; }
.count b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.switch p { font-size: .92rem; }
.switch small { display: block; color: var(--muted); font-size: .8rem; }
.tog { width: 48px; height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; padding: 0; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .18s, background .18s; }
.tog[aria-pressed="true"] { background: var(--star); border-color: var(--star); }
.tog[aria-pressed="true"]::after { transform: translateX(20px); background: var(--on-star); }

/* meal cards */
.meals { display: flex; flex-direction: column; gap: 10px; }
.meal { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 14px 12px; transition: opacity .2s; }
.meal.done { opacity: .62; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.chk svg { width: 24px; height: 24px; fill: transparent; stroke: var(--muted); stroke-width: 1.4; stroke-linejoin: round; }
.chk[aria-pressed="true"] { border-color: var(--star); }
.chk[aria-pressed="true"] svg { fill: var(--star); stroke: var(--star); filter: drop-shadow(0 0 5px var(--glow)); animation: pop .3s ease-out; }
@keyframes pop { 0% { transform: scale(.5) rotate(-30deg); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
.meal h3 { font-family: var(--f-display); font-weight: 800; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; padding-top: 3px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: .93rem; padding: 3px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.pill.extra { border-color: var(--star); color: var(--star-ink); font-weight: 600; }
.note { color: var(--muted); font-size: .85rem; margin-top: 8px; }

/* week */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
details.day { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
details.day summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
details.day summary::-webkit-details-marker { display: none; }
details.day summary h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
details.day summary .d { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
details.day summary::after { content: "+"; margin-left: auto; font-family: var(--f-mono); color: var(--star-ink); font-size: 1.2rem; }
details.day[open] summary::after { content: "−"; }
.dbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: .93rem; }
.row b { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.link { align-self: flex-start; background: transparent; border: 1px solid var(--star); color: var(--star-ink); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .85rem; }

/* shopping */
.alert { background: var(--surface-2); border: 1px solid var(--rose); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.alert b { color: var(--rose); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--star); border-radius: 999px; transition: width .25s; }
.group h2 { font-size: .82rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 4px; font-family: var(--f-display); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.item:first-child { border-top: 0; }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; }
.box svg { width: 14px; height: 14px; stroke: var(--on-star); stroke-width: 3; fill: none; opacity: 0; }
.item input:checked + .box { background: var(--star); border-color: var(--star); }
.item input:checked + .box svg { opacity: 1; }
.item input:focus-visible + .box { outline: 2px solid var(--star-ink); outline-offset: 2px; }
.item .n { flex: 1; min-width: 0; }
.item .qty { font-family: var(--f-mono); font-size: .85rem; color: var(--star-ink); text-align: right; }
.item.on .n { color: var(--muted); text-decoration: line-through; }
.ghost { align-self: center; background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 8px 18px; border-radius: 999px; font-weight: 600; font-size: .88rem; }

/* batch cooking */
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 440px; font-size: .92rem; }
th { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--line); }
td { padding: 11px 14px; border-top: 1px solid var(--line); }
tbody tr:first-child td { border-top: 0; }
td.q, th.r { text-align: right; font-variant-numeric: tabular-nums; }
th.me, td.me { background: var(--surface-2); }
.calc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.calc input { width: 92px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 8px 10px; font-family: var(--f-mono); font-size: 1rem; }
.calc .out { font-family: var(--f-mono); color: var(--star-ink); font-size: 1.05rem; }
.tips { display: flex; flex-direction: column; gap: 10px; }
.tips p { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: .95rem; }
.tips svg { width: 14px; height: 14px; fill: var(--star); margin-top: 6px; }
.sub { color: var(--muted); font-size: .92rem; }

.tag { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: .7rem; letter-spacing: .3em; color: var(--muted); padding-top: 8px; }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 600; letter-spacing: .04em; }
nav.tabs a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[aria-current="page"] { color: var(--star-ink); background: var(--surface-2); }

@media (max-width: 420px) {
  h1 { font-size: 1.9rem; }
  .row { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  .chk[aria-pressed="true"] svg { animation: none; }
  .bar i, .tog::after, .meal { transition: none; }
}
</style>

      out.push({ id: 'd', label: 'Desayuno', items: q.d });
      out.push({ id: 'mm', label: 'Media mañana', items: ['Sándwich de york: 2 rebanadas + 60 g', 'Chorrito de aceite de oliva'] });
      out.push({ id: 'c', label: 'Comida', items: comida, note: q.cn });
      out.push({ id: 'm', label: 'Merienda', items: BATIDO });
      out.push({ id: 'n', label: 'Cena', items: q.n });
    }
    return out;
  }
  function ck(who, i, id) { return who + '-' + i + '-' + id; }
  function progress(who, i) {
    var sl = slots(who, i), n = 0;
    sl.forEach(function (s) { if (S.checks[ck(who, i, s.id)]) n++; });
    return { n: n, t: sl.length };
  }
  function pills(items) {
    return '<div class="pills">' + items.map(function (it) {
      var extra = it.charAt(0) === '+';
      return '<span class="pill' + (extra ? ' extra' : '') + '">' + fmt(it) + '</span>';
    }).join('') + '</div>';
  }

  /* views */
  function topbar(showWho) {
    var seg = showWho
      ? '<div class="seg" role="group" aria-label="Para quién">' +
        '<button data-act="who" data-v="yo" aria-pressed="' + (S.who === 'yo') + '">Yo</button>' +
        '<button data-act="who" data-v="hector" aria-pressed="' + (S.who === 'hector') + '">Héctor</button></div>'
      : '';
    return '<header class="top"><div class="brand">' + starSvg() + 'NEW NØVA TEAM</div>' + seg + '</header>';
  }

  function viewHoy() {
    var who = S.who, p = progress(who, sel);
    var nodes = '';
    for (var i = 0; i < 7; i++) {
      var pr = progress(who, i);
      var cls = 'node' + (pr.n === pr.t ? ' full' : pr.n > 0 ? ' part' : '') + (i === sel ? ' sel' : '') + (i === todayIdx ? ' today' : '');
      nodes += '<button class="' + cls + '" data-act="day" data-i="' + i + '" aria-label="' + DAYS[i] + ', ' + pr.n + ' de ' + pr.t + ' estrellas" aria-pressed="' + (i === sel) + '">' +
        '<span class="orb">' + starSvg() + '</span><span class="l">' + SHORT[i] + '</span><span class="d">' + dateOf(i).getDate() + '</span></button>';
    }
    var head = '<div class="dayhead"><p class="eyebrow">' + dateLabel(sel) + (sel === todayIdx ? ' · hoy' : '') + '</p><h1>' + DAYS[sel] + '</h1>' +
      (who === 'hector' ? '<span class="chip">Héctor: ' + INTENS[sel].toLowerCase() + '</span>' : '') +
      '<p class="count"><b>' + p.n + ' de ' + p.t + '</b> estrellas encendidas' + (p.n === p.t ? ' · día completo' : '') + '</p></div>';
    var train = who === 'yo'
      ? '<div class="switch"><p>Hoy entreno<small>Suma 1 plátano y 20 g de arroz en la comida</small></p><button class="tog" data-act="train" aria-pressed="' + !!S.train[sel] + '" aria-label="Hoy entreno"></button></div>'
      : '';
    var meals = slots(who, sel).map(function (s) {
      var key = ck(who, sel, s.id), on = !!S.checks[key];
      return '<article class="meal' + (on ? ' done' : '') + '"><button class="chk" data-act="chk" data-key="' + key + '" aria-pressed="' + on + '" aria-label="' + s.label + ' hecho">' + starSvg() + '</button>' +
        '<div><h3>' + s.label + '</h3>' + pills(s.items) + (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') + '</div></article>';
    }).join('');
    return topbar(true) + '<section class="const" aria-label="Tu semana">' + nodes + '</section>' + head + train + '<section class="meals">' + meals + '</section>' +
      '<p class="tag">CHASE YOUR ØWN STAR</p>';
  }

  function viewSemana() {
    var who = S.who;
    var daily = who === 'yo'
      ? '<div class="card"><h2>Todos los días</h2><p class="sub">Media mañana: sándwich de york (2 rebanadas + 60 g) con un chorrito de aceite de oliva.</p><p class="sub">Merienda: batido para ganar peso, 250 ml de leche sin lactosa + 1 plátano + 30 g de avena + 15 g de crema de cacahuete.</p><p class="sub">Los días que entreno: 1 plátano más y 20 g más de arroz en la comida.</p></div>'
      : '<div class="card"><h2>Días clave</h2><p class="sub">Martes, viernes y domingo: 1 plátano antes de entrenar y batido de proteína después.</p></div>';
    var days = DAYS.map(function (n, i) {
      var rows = slots(who, i).map(function (s) {
        return '<div class="row"><b>' + s.label + '</b><span>' + s.items.map(fmt).join(' · ') + '</span></div>';
      }).join('');
      return '<details class="day"' + (i === sel ? ' open' : '') + '><summary><h3>' + n + '</h3><span class="d">' + dateLabel(i) + '</span>' +
        (who === 'hector' ? '<span class="chip">' + INTENS[i].replace('Día ', '') + '</span>' : '') + '</summary><div class="dbody">' + rows +
        '<button class="link" data-act="goday" data-i="' + i + '">Ver en Hoy</button></div></details>';
    }).join('');
    return topbar(true) + '<div class="dayhead"><p class="eyebrow">Para dos · todo sin lactosa · pesos en crudo</p><h1>Menú de la semana</h1></div>' + daily + '<section class="meals">' + days + '</section>';
  }

  function shopCounts() {
    var t = 0, d = 0;
    SHOP.forEach(function (g, gi) { g[1].forEach(function (_, ii) { t++; if (S.shop[gi + '-' + ii]) d++; }); });
    return { t: t, d: d };
  }
  function viewCompra() {
    var c = shopCounts();
    var groups = SHOP.map(function (g, gi) {
      var items = g[1].map(function (it, ii) {
        var id = gi + '-' + ii, on = !!S.shop[id];
        return '<label class="item' + (on ? ' on' : '') + '"><input type="checkbox" data-shop="' + id + '"' + (on ? ' checked' : '') + '><span class="box"><svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7"/></svg></span><span class="n">' + esc(it[0]) + '</span><span class="qty">' + esc(it[1]) + '</span></label>';
      }).join('');
      return '<section class="group"><h2>' + g[0] + '</h2><div class="list">' + items + '</div></section>';
    }).join('');
    return topbar(false) + '<div class="dayhead"><p class="eyebrow">Para los dos · una semana completa</p><h1>Lista de la compra</h1><p class="count"><b id="shopcount">' + c.d + ' de ' + c.t + '</b> en el carro</p></div>' +
      '<div class="bar" aria-hidden="true"><i id="shopbar" style="width:' + Math.round(100 * c.d / c.t) + '%"></i></div>' +
      '<p class="alert"><b>Ojo con la lactosa escondida.</b> Revisa la etiqueta del york, el pan de molde y las salsas, que muchos llevan leche.</p>' + groups +
      '<button class="ghost" id="reset" data-act="reset">Vaciar el carro</button>';
  }

  function viewTandas() {
    var t1 = [['Arroz', '700 g', '940 g', '280 g'], ['Pasta (comida del miércoles)', '250 g', '—', '—'], ['Pechuga de pollo', '1 kg', '1 kg', '330 g'], ['Ternera picada con tomate', '280 g', '—', '—'], ['Patata (cocida o asada)', '950 g', '400 g', '500 g'], ['Verdura al horno', '1,5 kg', '1,5 kg', '500 g']];
    var t2 = [['Arroz de la comida (crudo)', '150–180 g', '100 g'], ['Arroz de la cena, martes y viernes (crudo)', '100–120 g', '70 g'], ['Pollo por comida (crudo)', '200 g', '130 g'], ['Patata por cena', '250–300 g', '200 g']];
    var a = '<div class="tblwrap"><table><thead><tr><th>Qué cocinar</th><th class="r">Domingo<br>lun–mié</th><th class="r">Miércoles<br>jue–sáb</th><th class="r">Domingo mañana<br>ese día</th></tr></thead><tbody>' +
      t1.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="q"><span class="q">' + r[1] + '</span></td><td class="q"><span class="q">' + r[2] + '</span></td><td class="q"><span class="q">' + r[3] + '</span></td></tr>'; }).join('') + '</tbody></table></div>';
    var b = '<div class="tblwrap"><table><thead><tr><th>Cómo repartir en tuppers</th><th class="r">Héctor</th><th class="r me">Yo</th></tr></thead><tbody>' +
      t2.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="q"><span class="q">' + r[1] + '</span></td><td class="q me"><span class="q">' + r[2] + '</span></td></tr>'; }).join('') + '</tbody></table></div>';
    var calc = '<div class="card"><h2>Arroz crudo a tupper</h2><p class="sub">El arroz cocido pesa unas 2,5 veces su peso en crudo.</p><div class="calc"><input id="raw" type="number" inputmode="numeric" min="0" value="100" aria-label="Gramos de arroz en crudo"><span>g en crudo</span><span>→</span><span class="out" id="cooked">250 g</span><span>en el tupper</span></div></div>';
    var tips = ['Enfriar el arroz rápido, extendido en bandeja, y a la nevera antes de 1 hora.', 'Arroz y pollo cocinados aguantan 3 días en la nevera. Lo del sábado se puede congelar el miércoles y sacar el viernes por la noche.', 'Recalentar el arroz bien caliente y solo una vez.'];
    var cons = '<div class="card"><h2>Conservación</h2><div class="tips">' + tips.map(function (t) { return '<p>' + starSvg() + '<span>' + t + '</span></p>'; }).join('') + '</div></div>';
    var now_ = '<div class="card"><h2>Al momento</h2><p class="sub">Tortillas, salmón del martes, pescado blanco del jueves, atún y huevos del viernes, desayunos, sándwiches y el batido.</p></div>';
    return topbar(false) + '<div class="dayhead"><p class="eyebrow">Pesos en crudo, para los dos</p><h1>Cocinar en dos tandas</h1></div>' + a + b + calc + now_ + cons + '<p class="tag">CHASE YOUR ØWN STAR</p>';
  }

  /* shell */
  var VIEWS = { hoy: viewHoy, semana: viewSemana, compra: viewCompra, tandas: viewTandas };
  var ICONS = {
    hoy: '<svg viewBox="0 0 24 24"><path d="' + STAR + '"/></svg>',
    semana: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    compra: '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    tandas: '<svg viewBox="0 0 24 24"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5z"/><path d="M8 7c0-1.5 1.5-1.5 1.5-3M13 7c0-1.5 1.5-1.5 1.5-3"/></svg>'
  };
  var LABELS = { hoy: 'Hoy', semana: 'Semana', compra: 'Compra', tandas: 'Tandas' };
  function current() { var h = (location.hash || '').replace('#', ''); return VIEWS[h] ? h : 'hoy'; }

  function render(focusKey) {
    var v = current();
    document.getElementById('app').innerHTML = VIEWS[v]();
    document.getElementById('tabs').innerHTML = Object.keys(VIEWS).map(function (k) {
      return '<a href="#' + k + '"' + (k === v ? ' aria-current="page"' : '') + '>' + ICONS[k] + LABELS[k] + '</a>';
    }).join('');
    if (focusKey) { var el = document.querySelector('[data-key="' + focusKey + '"]'); if (el) el.focus({ preventScroll: true }); }
  }

  var resetTimer = null;
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'who') { S.who = t.getAttribute('data-v'); save(); render(); }
    else if (act === 'day') { sel = +t.getAttribute('data-i'); render(); }
    else if (act === 'goday') { sel = +t.getAttribute('data-i'); if (current() === 'hoy') render(); else location.hash = '#hoy'; window.scrollTo(0, 0); }
    else if (act === 'chk') { var k = t.getAttribute('data-key'); S.checks[k] = !S.checks[k]; save(); render(k); }
    else if (act === 'train') { S.train[sel] = !S.train[sel]; save(); render(); }
    else if (act === 'reset') {
      if (t.getAttribute('data-armed')) { S.shop = {}; save(); clearTimeout(resetTimer); render(); }
      else {
        t.setAttribute('data-armed', '1'); t.textContent = '¿Seguro? Pulsa otra vez';
        resetTimer = setTimeout(function () { t.removeAttribute('data-armed'); t.textContent = 'Vaciar el carro'; }, 3500);
      }
    }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.getAttribute && e.target.getAttribute('data-shop'); if (id == null) return;
    S.shop[id] = e.target.checked; save();
    e.target.closest('.item').classList.toggle('on', e.target.checked);
    var c = shopCounts();
    document.getElementById('shopcount').textContent = c.d + ' de ' + c.t;
    document.getElementById('shopbar').style.width = Math.round(100 * c.d / c.t) + '%';
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'raw') return;
    var v = parseFloat(e.target.value);
    document.getElementById('cooked').textContent = (isNaN(v) ? 0 : Math.round(v * 2.5)) + ' g';
  });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  render();
})();
</script>

</body></html>
